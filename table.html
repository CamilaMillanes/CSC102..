<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        
        body{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background-color: rgb(183, 128, 128);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 1000px;
           
        }
        table{
            border-collapse: collapse;
            width: 60%;
            margin: 20px 0;
            box-shadow: 3px 3px 3px 3px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px;
        }

        th{
            background-color: rgb(131, 131, 202);
            color: rgb(0, 0, 0);
        }

    </style>
</head>
<body>

        <table>
            <thead>
                <tr>
                    <th>Pizza Toppings</th>
                    <th>Sandwhich Toppings</th>
                    <th>Burrito Toppings</th>
                </tr>
            </thead>
    
            <tbody>
                <tr>
                    <td>Pepperoni</td>
                    <td>Cheese</td>
                    <td>Cilantro</td>
                </tr>
    
                <tr>
                    <td>Ham</td>
                    <td>Roast Beef</td>
                    <td>Onions</td>
                </tr>
    
                <tr>
                    <td>Pineapple</td>
                    <td>Mustard</td>
                    <td>Salsa</td>
                </tr>
    
                <tr>
                    <td>Olives</td>
                    <td>Cucumbers</td>
                    <td>Diced Tomatoes</td>
                </tr>
            </tbody>
        </table>
 
</body>
</html>
